# Harness Configuration
# This file controls the harness behavior for this project.

harness:
  version: "1.0.0"
  project_name: ""  # Auto-detected from git repo name or directory name

# Provider integrations
providers:
  claude_code:
    enabled: true
    hooks: true
  opencode:
    enabled: true
    hooks: true
  cursor:
    enabled: false  # Enable when Cursor is used
    hooks: true
  codex:
    enabled: false  # Enable when Codex CLI is used

# Specialist packs to enable
# Available: backend, database, frontend, security, testing, devops
specialist_packs: []

# Memory configuration
memory:
  # Shared memory is committed to version control
  # Local memory is gitignored
  shared_path: ".harness/memory/shared"
  local_path: ".harness/memory/local"
  # Memory quality: only save durable, useful, project-specific knowledge
  auto_save: false

# Hooks configuration
hooks:
  session_start: true
  before_task: true
  after_task: true
  before_commit: true

# Skills configuration
skills:
  # Core skills are always available
  # Additional skills can be loaded from specialist packs
  load_packs: true

# Dashboard configuration
dashboard:
  enabled: true  # Set to false to disable dashboard data recording
